{% extends "mailer/base.html" %}
{% block title %}Log in · Email automation{% endblock %}
{% block content %}
<div class="login card card-pad">
  <div class="row" style="gap:10px;margin-bottom:18px">
    <span class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </span>
    <h1>Email automation</h1>
  </div>
  <form method="post">{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-error" style="margin-bottom:14px">Wrong username or password.</div>{% endif %}
    <div class="field">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit" style="width:100%">Log in</button>
  </form>
  <p class="small muted" style="margin-top:14px">No account yet? Run <code>python manage.py createsuperuser</code>.</p>
</div>
{% endblock %}
